name: "Deploy Viiri VII Web Build"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot + Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Export Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          echo "=== Contenido de build/web ==="
          ls -la build/web

      - name: Add COI Service Worker (fix for GitHub Pages)
        run: |
          cd build/web
          
          # Descargar el service worker
          curl -sL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js -o coi-serviceworker.js
          
          # Inyectar el script en el index.html (justo después de <head>)
          sed -i 's|<head>|<head>\n<script src="coi-serviceworker.js"></script>|' index.html
          
          echo "=== index.html modificado ==="
          head -n 20 index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
