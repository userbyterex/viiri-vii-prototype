name: "Deploy Viiri VII Web Build"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Web Project
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Prepare HTML5 Files
        run: |
          mkdir -p deploy_web
          find /home/runner/.local/share/godot/exports/ -type f -exec cp {} deploy_web/ \;
          cd deploy_web
          html_file=$(ls *.html | head -n 1)
          if [ -n "$html_file" ] && [ "$html_file" != "index.html" ]; then
            mv "$html_file" index.html
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
