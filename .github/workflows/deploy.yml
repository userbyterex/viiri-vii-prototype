name: "Deploy Viiri VII Web Build"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Web Project
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_name: Web

      - name: Prepare HTML5 Files
        run: |
          echo "=== Buscando archivos exportados ==="
          find . -name "*.wasm" -o -name "*.html" -o -name "*.js" | head -20
          
          mkdir -p deploy_web
          
          # Buscar el .wasm
          WASM_FILE=$(find . -name "*.wasm" | head -n 1)
          
          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo .wasm"
            echo "Contenido del directorio:"
            ls -la
            exit 1
          fi
          
          EXPORT_DIR=$(dirname "$WASM_FILE")
          echo "Carpeta de exportación encontrada: $EXPORT_DIR"
          
          # Copiar todo el contenido de la carpeta de exportación
          cp -a "$EXPORT_DIR"/* deploy_web/ 2>/dev/null || cp -a "$EXPORT_DIR"/. deploy_web/
          
          # Asegurar que exista index.html
          cd deploy_web
          if [ ! -f "index.html" ]; then
            html_file=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$html_file" ]; then
              mv "$html_file" index.html
              echo "Renombrado $html_file → index.html"
            else
              echo "ERROR: No se encontró ningún archivo HTML"
              ls -la
              exit 1
            fi
          fi
          
          echo "=== Contenido final de deploy_web ==="
          ls -la

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
