<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viiri VII: Parasite Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .game-container { background: #121820; border: 2px solid #00e5ff; border-radius: 12px; width: 100%; max-width: 800px; padding: 20px; box-shadow: 0 0 25px rgba(0, 229, 255, 0.2); }
        h1 { color: #00e5ff; text-align: center; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .battle-arena { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        @media(min-width: 600px) { .battle-arena { display: grid; grid-template-columns: 1fr 1fr; } }
        .card { background: #1e293b; border-radius: 8px; padding: 15px; border-left: 4px solid #00e5ff; }
        .card.enemy { border-left-color: #ff0055; }
        .card-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; color: #fff; }
        .stat-line { font-size: 14px; margin: 6px 0; color: #cbd5e1; }
        .bar-container { background: #0f172a; border-radius: 6px; height: 12px; width: 100%; overflow: hidden; margin-top: 4px; border: 1px solid #334155; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-fill { background: linear-gradient(90deg, #10b981, #059669); }
        .inf-fill { background: linear-gradient(90deg, #8b5cf6, #d946ef); }
        .limit-fill { background: linear-gradient(90deg, #f59e0b, #ef4444); }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button { background: #0f172a; color: #00e5ff; border: 1px solid #00e5ff; padding: 12px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: left; }
        button:hover:not(:disabled) { background: #00e5ff; color: #0b0e14; box-shadow: 0 0 12px rgba(0,229,255,0.4); }
        button:disabled { opacity: 0.4; border-color: #475569; color: #64748b; cursor: not-allowed; }
        .btn-limit { border-color: #ff0055; color: #ff0055; }
        .btn-limit:hover:not(:disabled) { background: #ff0055; color: #fff; box-shadow: 0 0 12px rgba(255,0,85,0.5); }
        .log-box { background: #090d12; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #38bdf8; line-height: 1.5; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Viiri VII: Parasite Core</h1>
    <div class="subtitle">Oakhaven Prime - Perímetro del Reactor 03</div>

    <div class="battle-arena">
        <!-- VESPER PANEL -->
        <div class="card">
            <div class="card-title">Vesper (Mercenaria)</div>
            <div class="stat-line" id="vesper-hp-txt">HP: 100 / 100</div>
            <div class="bar-container"><div id="vesper-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
            
            <div class="stat-line" id="vesper-inf-txt" style="margin-top:10px;">Infección Parásita: 15%</div>
            <div class="bar-container"><div id="vesper-inf-bar" class="bar-fill inf-fill" style="width: 15%;"></div></div>

            <div class="stat-line" id="vesper-lim-txt" style="margin-top:10px;">Límite: 0%</div>
            <div class="bar-container"><div id="vesper-lim-bar" class="bar-fill limit-fill" style="width: 0%;"></div></div>
        </div>

        <!-- ENEMY PANEL -->
        <div class="card enemy">
            <div class="card-title">Guardián Biomecánico</div>
            <div class="stat-line" id="enemy-hp-txt">HP: 250 / 250</div>
            <div class="bar-container"><div id="enemy-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 25px;">
                Estatus: <span style="color: #ff0055;">Blindaje Activo</span>
            </div>
        </div>
    </div>

    <div class="actions">
        <button onclick="attackBasic()">1. Ataque Básico (Arma Pesada)</button>
        <button onclick="attackMagic()">2. Magia Parásita [Tech-Pulse] (+10% Infección)</button>
        <button id="btn-limit" class="btn-limit" onclick="attackLimit()" disabled>3. LIMIT BREAK: DESPERTAR CORE (Requiere 100%)</button>
    </div>

    <div class="log-box" id="combat-log">
        > Sistema iniciado. Vesper ha entablado combate con el Guardián Biomecánico.<br>
    </div>
</div>

<script>
    let vHp = 100, vMaxHp = 100;
    let vInf = 15;
    let vLim = 0;
    let eHp = 250, eMaxHp = 250;

    function log(msg) {
        const box = document.getElementById('combat-log');
        box.innerHTML += '> ' + msg + '<br>';
        box.scrollTop = box.scrollHeight;
    }

    function update() {
        document.getElementById('vesper-hp-txt').innerText = `HP: ${vHp} / ${vMaxHp}`;
        document.getElementById('vesper-hp-bar').style.width = `${(vHp/vMaxHp)*100}%`;

        document.getElementById('vesper-inf-txt').innerText = `Infección Parásita: ${vInf}%`;
        document.getElementById('vesper-inf-bar').style.width = `${vInf}%`;

        document.getElementById('vesper-lim-txt').innerText = `Límite: ${vLim}%`;
        document.getElementById('vesper-lim-bar').style.width = `${vLim}%`;

        document.getElementById('enemy-hp-txt').innerText = `HP: ${eHp} / ${eMaxHp}`;
        document.getElementById('enemy-hp-bar').style.width = `${(eHp/eMaxHp)*100}%`;

        const btnLimit = document.getElementById('btn-limit');
        if(vLim >= 100) {
            btnLimit.disabled = false;
            btnLimit.innerText = "3. LIMIT BREAK: DESPERTAR CORE (¡LISTO!)";
        } else {
            btnLimit.disabled = true;
            btnLimit.innerText = `3. LIMIT BREAK: DESPERTAR CORE (${vLim}%)`;
        }
    }

    function enemyTurn() {
        if(eHp <= 0) {
            log('<span style="color:#10b981; font-weight:bold;">¡VICTORIA! El Guardián Biomecánico ha sido destruido.</span>');
            return;
        }
        let dmg = Math.floor(Math.random() * 9) + 10;
        vHp = Math.max(0, vHp - dmg);
        log(`El Guardián ataca con Cañón de Plasma por <b style="color:#ff0055">${dmg} de daño</b>.`);
        if(vHp <= 0) {
            log('<span style="color:#ef4444; font-weight:bold;">DERROTA - Vesper ha sido eliminada.</span>');
        }
        update();
    }

    function attackBasic() {
        if(eHp <= 0 || vHp <= 0) return;
        let dmg = Math.floor(Math.random() * 8) + 18;
        eHp = Math.max(0, eHp - dmg);
        vLim = Math.min(100, vLim + 20);
        log(`Vesper dispara su arma pesada causando <b>${dmg} de daño</b>. (+20% Límite)`);
        update();
        setTimeout(enemyTurn, 600);
    }

    function attackMagic() {
        if(eHp <= 0 || vHp <= 0) return;
        let dmg = Math.floor(Math.random() * 16) + 35;
        eHp = Math.max(0, eHp - dmg);
        vInf = Math.min(100, vInf + 10);
        vLim = Math.min(100, vLim + 30);
        log(`Vesper usa <b style="color:#8b5cf6">Tech-Pulse Parasitario</b> causando <b>${dmg} de daño</b>. (+10% Infección, +30% Límite)`);
        update();
        setTimeout(enemyTurn, 600);
    }

    function attackLimit() {
        if(eHp <= 0 || vHp <= 0 || vLim < 100) return;
        let dmg = Math.floor(Math.random() * 31) + 100;
        eHp = Math.max(0, eHp - dmg);
        vLim = 0;
        log(`<b style="color:#ff0055; font-size: 13px;">>>> CORE DESPERTAR: Vesper desata SOBRECARGA PARÁSITA causando ${dmg} DE DAÑO MASIVO!</b>`);
        update();
        setTimeout(enemyTurn, 600);
    }

    update();
</script>
</body>
</html>
